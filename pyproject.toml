[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-interference-analysis"
version = "0.1.0"
description = "Transparent event-based analysis of GNSS receiver metrics"
requires-python = ">=3.10"
authors = [{name = "Olha Partyka"}]
license = "MIT"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
gnss-analyse = "gnss_interference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
